; ============================================================
; PHP Runtime Hardening Configuration (.user.ini)
; Protects against information leakage and hardens sessions
; Active in CGI / FastCGI / PHP-FPM environments
; ============================================================

display_errors = Off
display_startup_errors = Off
log_errors = On

; Cookie Security Directives
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
